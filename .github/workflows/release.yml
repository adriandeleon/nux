name: Release

# Builds native installers on a per-platform matrix (jpackage cannot cross-build)
# and attaches them to a GitHub release on a v* tag. workflow_dispatch = dry run
# (artifacts only, no release).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            types: "DEB RPM"
          - os: ubuntu-24.04-arm
            target: linux-arm64
            types: "DEB"
          - os: macos-latest
            target: macos-arm64
            types: "DMG"
          - os: macos-15-intel
            target: macos-x64
            types: "DMG"
          - os: windows-latest
            target: windows-x64
            types: "MSI"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Install RPM tooling
        if: matrix.target == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -m1 "<version>" pom.xml | sed -E 's/.*<version>([^<]+)<\/version>.*/\1/')
            VERSION="${VERSION%-SNAPSHOT}"
          fi
          # jpackage on macOS rejects an app version whose first number is 0
          # (CFBundleVersion rule); bump the bundle-metadata version only.
          APPVER="$VERSION"
          if [[ "$RUNNER_OS" == "macOS" && "$APPVER" == 0.* ]]; then
            APPVER="1${APPVER#0}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "appver=$APPVER" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION (jpackage app-version $APPVER)"

      - name: Test
        shell: bash
        run: mvn --batch-mode test

      - name: Package
        shell: bash
        run: |
          for type in ${{ matrix.types }}; do
            echo "== jpackage type $type"
            mvn --batch-mode -Pdist package -DskipTests \
              -Djpackage.type="$type" \
              -Djpackage.appVersion="${{ steps.version.outputs.appver }}"
          done

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p stage
          shopt -s nullglob
          for f in target/dist/*.deb target/dist/*.rpm target/dist/*.dmg target/dist/*.msi; do
            ext="${f##*.}"
            cp "$f" "stage/Nux-${{ steps.version.outputs.version }}-${{ matrix.target }}.${ext}"
          done
          ls -la stage/

      - uses: actions/upload-artifact@v4
        with:
          name: nux-${{ matrix.target }}
          path: stage/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
