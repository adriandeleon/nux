name: Release

# Builds native installers on a per-platform matrix (jpackage cannot cross-build)
# and attaches them to a GitHub release on a v* tag. workflow_dispatch = dry run
# (artifacts only, no release).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            types: "DEB RPM"
          - os: ubuntu-24.04-arm
            target: linux-arm64
            types: "DEB"
          - os: macos-latest
            target: macos-arm64
            types: "DMG"
          - os: macos-15-intel
            target: macos-x64
            types: "DMG"
          - os: windows-latest
            target: windows-x64
            types: "MSI"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Install RPM tooling
        if: matrix.target == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Resolve version
        id: version
        shell: bash
        run: |
          POM_VERSION=$(grep -m1 "<version>" pom.xml | sed -E 's/.*<version>([^<]+)<\/version>.*/\1/')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            # The pom is the only place a version lives (About window, update check);
            # a tag that disagrees would publish installers that misreport themselves.
            if [[ "$VERSION" != "$POM_VERSION" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the pom version $POM_VERSION"
              exit 1
            fi
          else
            VERSION="${POM_VERSION%-SNAPSHOT}"
          fi
          # jpackage takes only a plain dotted number: drop a -rc1/-beta suffix (it
          # still names the artifacts and the release).
          APPVER="${VERSION%%-*}"
          # jpackage on macOS rejects an app version whose first number is 0
          # (CFBundleVersion rule); bump the bundle-metadata version only.
          if [[ "$RUNNER_OS" == "macOS" && "$APPVER" == 0.* ]]; then
            APPVER="1${APPVER#0}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "appver=$APPVER" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION (jpackage app-version $APPVER)"

      - name: Test
        shell: bash
        run: ./mvnw --batch-mode test

      # macOS Developer ID signing. The .p12 (certificate + key + Apple's Developer ID G2
      # intermediate) goes into a throw-away keychain, and jpackage signs the app itself as it
      # builds the dmg: this step writes its signing options (identity, keychain,
      # packaging/macos/Nux.entitlements) to an @file that Package passes as -Djpackage.signArgs.
      # "Notarize the dmg" below signs the dmg, has Apple notarize it and staples the ticket.
      #
      # On a tag, missing secrets fail the leg: an unsigned dmg is what this exists to stop
      # shipping. A manual dry run without them builds ad-hoc signed and says so.
      - name: Import signing certificate (macOS)
        id: macsign
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$MACOS_CERT_P12" ] || [ -z "$MACOS_CERT_PASSWORD" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error title=macOS signing secrets missing::MACOS_CERT_P12 / MACOS_CERT_PASSWORD are not set; refusing to release an unsigned dmg"
              exit 1
            fi
            echo "::warning title=macOS build unsigned::no signing secrets, so this dry run's dmg is ad-hoc signed and not notarized"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          kc="$RUNNER_TEMP/nux-signing.keychain-db"
          kcpass="$(uuidgen)"
          security create-keychain -p "$kcpass" "$kc"
          # No auto-lock during the build (the default locks after 5 minutes of inactivity).
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          p12="$RUNNER_TEMP/nux-signing.p12"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$p12"
          if ! security import "$p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign; then
            rm -f "$p12"
            echo "::error title=Certificate import failed::macOS could not open MACOS_CERT_P12 with MACOS_CERT_PASSWORD. Usually the password secret does not match the .p12 (re-set it at the gh prompt; a piped echo adds a newline); otherwise the .p12 was exported without openssl's -legacy"
            exit 1
          fi
          rm -f "$p12"
          # Lets codesign use the key without the GUI prompt a runner can never answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$kc" > /dev/null
          # Add it to the search list next to the login keychain, which codesign needs to build the chain.
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$kc" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            security find-identity -v -p codesigning "$kc"
            echo "::error title=No Developer ID identity::the imported .p12 holds no valid Developer ID Application identity"
            exit 1
          fi
          echo "Signing as: $identity"
          args="$RUNNER_TEMP/jpackage-mac-sign.args"
          {
            echo "--mac-sign"
            echo "--mac-app-image-sign-identity \"$identity\""
            echo "--mac-signing-keychain \"$kc\""
            echo "--mac-entitlements \"$GITHUB_WORKSPACE/packaging/macos/Nux.entitlements\""
          } > "$args"
          cat "$args"
          {
            echo "NUX_JPACKAGE_SIGN_ARGS=$args"
            echo "NUX_MAC_SIGN_IDENTITY=$identity"
            echo "NUX_MAC_KEYCHAIN=$kc"
          } >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Package
        shell: bash
        # Each run replaces target/dist (removeDestination), so move every installer
        # out before the next type is built — otherwise the RPM run deletes the DEB
        # and the release ships without one (which is what happened to 0.6.0).
        # On a signing macOS leg jpackage also signs the app (see the step above).
        run: |
          mkdir -p packages
          shopt -s nullglob
          for type in ${{ matrix.types }}; do
            echo "== jpackage type $type"
            ./mvnw --batch-mode -Pdist package -DskipTests \
              -Djpackage.type="$type" \
              -Djpackage.appVersion="${{ steps.version.outputs.appver }}" \
              ${NUX_JPACKAGE_SIGN_ARGS:+"-Djpackage.signArgs=@$NUX_JPACKAGE_SIGN_ARGS"}
            mv target/dist/*.deb target/dist/*.rpm target/dist/*.dmg target/dist/*.msi packages/
          done

      # The dmg gets its own signature (jpackage signs only the app inside it), then Apple scans it
      # and, if it passes, issues a ticket; stapling attaches it so Gatekeeper accepts the dmg
      # offline too. A rejection prints Apple's log, which names each offending file. The checks at
      # the end are what Gatekeeper does on a user's Mac, and then the notarized app is started under
      # the hardened runtime and must still be running 20 seconds later (no NUT server on a runner,
      # so it just shows its window).
      - name: Notarize the dmg (macOS)
        if: steps.macsign.outputs.enabled == 'true'
        shell: bash
        timeout-minutes: 35
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_API_KEY_P8" ] || [ -z "$APPLE_API_KEY_ID" ]; then
            echo "::error title=Notarization secrets missing::APPLE_API_KEY_P8 / APPLE_API_KEY_ID are not set"
            exit 1
          fi
          # Easy to mix up when copying them off the Integrations page: the issuer is a UUID shown
          # above the key list, the key ID is 10 characters in the key's row.
          uuid='^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
          if [ -n "$APPLE_API_ISSUER" ] && ! [[ "$APPLE_API_ISSUER" =~ $uuid ]]; then
            echo "::error title=APPLE_API_ISSUER is not an issuer ID::it must be the UUID shown as Issuer ID above the team key list (xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx)"
            exit 1
          fi
          if ! [[ "$APPLE_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error title=APPLE_API_KEY_ID is not a key ID::it must be the 10-character Key ID from the key's row"
            exit 1
          fi
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key"
          # A team key needs the issuer; an individual key has none.
          auth=(--key "$key" --key-id "$APPLE_API_KEY_ID")
          [ -n "$APPLE_API_ISSUER" ] && auth+=(--issuer "$APPLE_API_ISSUER")

          dmg="$(ls packages/*.dmg | head -1)"
          codesign --force --timestamp --keychain "$NUX_MAC_KEYCHAIN" --sign "$NUX_MAC_SIGN_IDENTITY" "$dmg"
          codesign --verify --verbose=2 "$dmg"
          # The app INSIDE the dmg must carry our signature, intact, with the hardened runtime.
          # Checking here takes seconds and names what is wrong; Apple takes minutes to say "invalid".
          pre="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$pre" "$dmg" > /dev/null
          details="$(codesign -dv --verbose=2 "$pre"/*.app 2>&1 || true)"
          echo "$details"
          if ! grep -q '^Authority=Developer ID Application' <<< "$details" || ! grep -q 'flags=.*runtime' <<< "$details"; then
            hdiutil detach "$pre" > /dev/null || true
            echo "::error title=dmg app not Developer ID signed::the app inside $(basename "$dmg") is not Developer ID signed with the hardened runtime"
            exit 1
          fi
          if ! codesign --verify --deep --strict --verbose=4 "$pre"/*.app; then
            hdiutil detach "$pre" > /dev/null || true
            echo "::error title=dmg app signature broken::the app inside $(basename "$dmg") does not verify; the codesign output above names what is wrong"
            exit 1
          fi
          hdiutil detach "$pre" > /dev/null

          echo "Notarizing $dmg"
          out="$(xcrun notarytool submit "$dmg" "${auth[@]}" --wait --timeout 30m --output-format json)" || true
          echo "$out"
          id="$(printf '%s' "$out" | jq -r '.id // empty')"
          status="$(printf '%s' "$out" | jq -r '.status // empty')"
          if [ -n "$id" ]; then
            xcrun notarytool log "$id" "${auth[@]}" || true
          fi
          rm -f "$key"
          if [ "$status" != "Accepted" ]; then
            echo "::error title=Notarization failed::Apple returned '${status:-no result}' for $(basename "$dmg"); the log above lists the problems"
            exit 1
          fi

          # Stapling fetches the ticket from Apple's CDN and validates it in the same call. That
          # fetch can drop, and the ticket sometimes takes a moment to publish, so retry it.
          for attempt in 1 2 3 4 5; do
            xcrun stapler staple "$dmg" && break
            [ "$attempt" = 5 ] && { echo "::error title=Stapling failed::notarized, but the ticket could not be stapled"; exit 1; }
            sleep 20
          done
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" > /dev/null
          trap 'hdiutil detach -force "$mnt" > /dev/null 2>&1 || true' EXIT
          app="$(ls -d "$mnt"/*.app | head -1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"

          log="$RUNNER_TEMP/nux-launch.log"
          "$app/Contents/MacOS/Nux" > "$log" 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2> /dev/null; then
            cat "$log"
            echo "::error title=Notarized app did not stay up::Nux exited within 20 s of starting under the hardened runtime; its output is above"
            exit 1
          fi
          kill "$pid" || true
          wait "$pid" 2> /dev/null || true
          echo "notarized app ran for 20 s under the hardened runtime"
          echo "- ✅ ${{ matrix.target }}: signed, notarized and stapled" >> "$GITHUB_STEP_SUMMARY"

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p stage
          shopt -s nullglob
          for f in packages/*.deb packages/*.rpm packages/*.dmg packages/*.msi; do
            ext="${f##*.}"
            cp "$f" "stage/Nux-${{ steps.version.outputs.version }}-${{ matrix.target }}.${ext}"
          done
          ls -la stage/

      - uses: actions/upload-artifact@v7
        with:
          name: nux-${{ matrix.target }}
          path: stage/*
          if-no-files-found: error

      # The runner is ephemeral, but the keychain holds the private key, so remove it as soon as
      # we're done.
      - name: Remove signing keychain (macOS)
        if: always() && steps.macsign.outputs.enabled == 'true'
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/nux-signing.keychain-db" || true

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          # A -rc/-beta tag is a pre-release. The in-app update check refuses
          # pre-releases, so this flag is what keeps users from being offered one.
          prerelease: ${{ contains(github.ref_name, '-') }}
