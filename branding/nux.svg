<?xml version="1.0" encoding="UTF-8"?>
<!-- Nux icon: a hex nut with a lightning bolt ("nux" is Latin for nut; the bolt is the UPS).
     Vector source of truth; the shipped PNGs are generated by scripts/gen_icon.java —
     keep the two in sync when redesigning. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d333b"/>
      <stop offset="1" stop-color="#16191d"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6c0ca"/>
      <stop offset="1" stop-color="#5f6a75"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <polygon points="256,81 104.4,168.5 104.4,343.5 256,431 407.6,343.5 407.6,168.5"
           fill="url(#steel)" stroke="url(#steel)" stroke-width="34" stroke-linejoin="round"/>
  <circle cx="256" cy="256" r="92" fill="#1b1f24"/>
  <polygon points="296,88 176,288 246,288 218,424 338,224 268,224"
           fill="#f0b429" stroke="#f0b429" stroke-width="10" stroke-linejoin="round"/>
</svg>
